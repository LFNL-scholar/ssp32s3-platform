<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S3控制系统</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    (function(){
      var m = localStorage.getItem('s3_theme_mode') || 'auto';
      var h = new Date().getHours();
      document.documentElement.dataset.theme = m === 'auto' ? (h >= 9 && h < 18 ? 'light' : 'dark') : m;
    })();
  </script>
</head>
<body class="canvas-bg">
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
